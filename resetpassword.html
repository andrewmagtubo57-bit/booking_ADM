<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Reset Password</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>Reset Password</h1>
    <p id="subtitle" class="subtitle">Checking your reset link...</p>

    <form id="resetForm" novalidate hidden>
      <label for="password">New Password</label>
      <div class="password-field">
        <input type="password" id="password" placeholder="Create a strong password"
               autocomplete="new-password" required>
        <button type="button" class="toggle-password" data-target="password"
                aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <small id="passwordError" class="field-error"></small>

      <div class="password-rules">
        <strong>Password requirements</strong>
        <ul>
          <li>At least 8 characters</li>
          <li>One uppercase and one lowercase letter</li>
          <li>One number and one special character</li>
          <li>No spaces</li>
        </ul>
      </div>

      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-field">
        <input type="password" id="confirmPassword" placeholder="Retype your new password"
               autocomplete="new-password" required>
        <button type="button" class="toggle-password" data-target="confirmPassword"
                aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <small id="confirmPasswordError" class="field-error"></small>

      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      <button id="saveButton" type="submit">Save New Password</button>
    </form>

    <p id="statusMessage" class="form-message" role="status" aria-live="polite"></p>
    <p class="auth-link"><a href="login.html">Back to login</a></p>
  </main>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");

    const subtitle = document.getElementById("subtitle");
    const form = document.getElementById("resetForm");
    const statusMessage = document.getElementById("statusMessage");
    const formMessage = document.getElementById("formMessage");
    const saveButton = document.getElementById("saveButton");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const passwordError = document.getElementById("passwordError");
    const confirmError = document.getElementById("confirmPasswordError");

    function setBox(el, text, type = "error") {
      el.textContent = text;
      el.className = text ? `form-message ${type}-message` : "form-message";
    }

    function validPassword(p) {
      return p.length >= 8 &&
        /[A-Z]/.test(p) && /[a-z]/.test(p) &&
        /[0-9]/.test(p) && /[^A-Za-z0-9\s]/.test(p) &&
        !/\s/.test(p);
    }

    function linkErrorText(error) {
      const known = {
        "auth/expired-action-code": "This reset link has expired. Please request a new one.",
        "auth/invalid-action-code": "This reset link is invalid or was already used. Please request a new one.",
        "auth/user-disabled": "This account has been disabled.",
        "auth/user-not-found": "No account was found for this link.",
        "auth/network-request-failed": "Network error. Check your internet connection and try again."
      };
      return known[error?.code] || "Something went wrong. Please request a new reset link.";
    }

    // Show / hide password toggles
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.setAttribute("aria-pressed", String(show));
        button.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });

    function showInvalidLink(text) {
      subtitle.textContent = "Link problem";
      form.hidden = true;
      setBox(statusMessage, text);
      document.querySelector(".auth-link").innerHTML =
        '<a href="forgot.html">Request a new reset link</a> · <a href="login.html">Back to login</a>';
    }

    // Step 1: check the link from the email
    async function init() {
      if (mode !== "resetPassword" || !oobCode) {
        showInvalidLink("This page must be opened from the link in your reset email.");
        return;
      }
      try {
        const email = await verifyPasswordResetCode(auth, oobCode);
        subtitle.textContent = `Choose a new password for ${email}`;
        form.hidden = false;
        passwordInput.focus();
      } catch (error) {
        console.error("Reset link error:", error);
        showInvalidLink(linkErrorText(error));
      }
    }

    // Step 2: save the new password
    form.addEventListener("submit", async event => {
      event.preventDefault();
      setBox(formMessage, "");
      passwordError.textContent = "";
      confirmError.textContent = "";
      passwordInput.setAttribute("aria-invalid", "false");
      confirmInput.setAttribute("aria-invalid", "false");

      const password = passwordInput.value;
      const confirm = confirmInput.value;
      let valid = true;

      if (!validPassword(password)) {
        passwordError.textContent = "Password must meet every requirement listed above.";
        passwordInput.setAttribute("aria-invalid", "true");
        valid = false;
      }
      if (!confirm) {
        confirmError.textContent = "Please retype your password.";
        confirmInput.setAttribute("aria-invalid", "true");
        valid = false;
      } else if (password !== confirm) {
        confirmError.textContent = "Passwords do not match.";
        confirmInput.setAttribute("aria-invalid", "true");
        valid = false;
      }
      if (!valid) {
        setBox(formMessage, "Please correct the red warnings above.");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      try {
        await confirmPasswordReset(auth, oobCode, password);
        form.hidden = true;
        subtitle.textContent = "All done";
        setBox(statusMessage, "Password changed successfully! Redirecting to login...", "success");
        setTimeout(() => { window.location.href = "login.html"; }, 1800);
      } catch (error) {
        console.error("Reset error:", error);
        if (error?.code === "auth/weak-password") {
          setBox(formMessage, "Choose a stronger password.");
        } else if (error?.code === "auth/expired-action-code" || error?.code === "auth/invalid-action-code") {
          showInvalidLink(linkErrorText(error));
        } else {
          setBox(formMessage, linkErrorText(error));
        }
        saveButton.disabled = false;
        saveButton.textContent = "Save New Password";
      }
    });

    init();
  </script>
</body>
</html>
