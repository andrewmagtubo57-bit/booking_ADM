<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Login</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>Login</h1>
    <p class="subtitle">Welcome back</p>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your registered email"
             autocomplete="email" required>
      <small id="emailError" class="field-error"></small>

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" placeholder="Enter your password"
               autocomplete="current-password" required>
        <button type="button" class="toggle-password" data-target="password"
                aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <small id="passwordError" class="field-error"></small>

      <div class="terms-row">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the Terms and Conditions</label>
      </div>
      <small id="termsError" class="field-error"></small>

      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      <button id="loginButton" type="submit">Login</button>
      <button class="secondary-button" type="button" id="createAccountButton">Create Account</button>
    </form>

    <p class="auth-link"><a href="forgot.html">Forgot password?</a></p>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
