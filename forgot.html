<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>Reset Password</h1>
    <p class="subtitle">We'll email you a password reset link.</p>
    <form id="forgotForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="Enter your registered email" required>
      <small id="emailError" class="field-error"></small>
      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      <button type="submit" id="resetButton">Send Reset Email</button>
    </form>
    <p class="auth-link"><a href="login.html">Back to login</a></p>
  </main>
  <script type="module" src="forgot.js"></script>
</body>
</html>
