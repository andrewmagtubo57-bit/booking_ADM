<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>My Biodata</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card home-card">
    <h1>Welcome</h1>
    <p id="welcomeMessage" class="subtitle">Loading your account...</p>

    <section aria-labelledby="biodataTitle">
      <h2 id="biodataTitle" class="biodata-title">My Biodata</h2>
      <div class="biodata-grid">
        <div class="biodata-item">
          <span class="biodata-label">Username</span>
          <span class="biodata-value" id="bioUsername">Loading...</span>
        </div>
        <div class="biodata-item">
          <span class="biodata-label">Email</span>
          <span class="biodata-value" id="bioEmail">Loading...</span>
        </div>
        <div class="biodata-item">
          <span class="biodata-label">Birthday</span>
          <span class="biodata-value" id="bioBirthday">Loading...</span>
        </div>
        <div class="biodata-item">
          <span class="biodata-label">Gender</span>
          <span class="biodata-value" id="bioGender">Loading...</span>
        </div>
      </div>
    </section>

    <p id="homeMessage" class="form-message" role="status" aria-live="polite"></p>
    <button id="bookButton" type="button">Book a Vehicle</button>
    <button id="logoutButton" class="secondary-button" type="button">Log Out</button>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import {
      doc, getDoc
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const welcome = document.getElementById("welcomeMessage");
    const message = document.getElementById("homeMessage");
    const bio = {
      username: document.getElementById("bioUsername"),
      email: document.getElementById("bioEmail"),
      birthday: document.getElementById("bioBirthday"),
      gender: document.getElementById("bioGender")
    };

    function setMessage(text, type = "error") {
      message.textContent = text;
      message.className = `form-message ${type}-message`;
    }

    function formatBirthday(value) {
      if (!value) return "Not provided";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString(undefined, {
        year: "numeric", month: "long", day: "numeric"
      });
    }

    function show(key, value) {
      bio[key].textContent = value || "Not provided";
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      welcome.textContent = `You are signed in${user.displayName ? ", " + user.displayName : ""}.`;

      // Show what Firebase Authentication already knows, then fill in the profile.
      show("username", user.displayName);
      show("email", user.email);
      show("birthday", "");
      show("gender", "");

      try {
        const snapshot = await getDoc(doc(db, "users", user.uid));
        if (!snapshot.exists()) {
          setMessage("Your biodata record was not found. Accounts created before the profile feature need to be registered again.");
          return;
        }
        const data = snapshot.data();
        show("username", data.username || user.displayName);
        show("email", data.email || user.email);
        bio.birthday.textContent = formatBirthday(data.birthday);
        show("gender", data.gender);
      } catch (error) {
        console.error("Could not load biodata:", error);
        if (error?.code === "permission-denied") {
          setMessage("Firebase denied access to your biodata. Check your Firestore security rules.");
        } else {
          setMessage("Could not load your biodata. Check your connection and try again.");
        }
      }
    });

    document.getElementById("bookButton").addEventListener("click", () => { window.location.href = "booking.html"; });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      try {
        await signOut(auth);
        sessionStorage.removeItem("loggedInUid");
        window.location.href = "login.html";
      } catch (error) {
        console.error(error);
        setMessage("Could not log out. Please try again.");
      }
    });
  </script>
</body>
</html>
